name: 每周清理原始库

# 每 7 天执行一次: vpngate.csv(原始累计库)会不断累积已下线的无效节点,
# 用 vpngate_tested.csv(有效库)覆盖它, 防止无效节点越积越多。
# 订阅文件始终由有效库生成, 这里不需要重建。
on:
  schedule:
    # 每周日 04:00 UTC 执行一次
    - cron: "0 4 * * 0"
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: vpngate-data
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 用有效库覆盖原始库
        # 有效库比原始库多 IsResidential / FraudScore / ExitIP 三列(ippure 画像),
        # 覆盖时只保留原始库的 5 列, 否则后续增量 append 会与新表头错列。
        run: |
          if [ ! -f vpngate_tested.csv ]; then
            echo "vpngate_tested.csv 不存在(检测任务尚未成功运行过), 跳过"
            exit 0
          fi
          before=$(($(wc -l < vpngate.csv) - 1))
          after=$(($(wc -l < vpngate_tested.csv) - 1))
          python - <<'PY'
          import csv

          RAW_HEADER = ["Country", "Hostname", "IP", "Speed_Mbps", "TCP_Port"]

          with open("vpngate_tested.csv", encoding="utf-8", errors="replace", newline="") as f:
              rows = [r for r in csv.DictReader(f) if (r.get("Hostname") or "").strip()]

          with open("vpngate.csv", "w", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=RAW_HEADER)
              w.writeheader()
              for r in rows:
                  w.writerow({k: (r.get(k) or "") for k in RAW_HEADER})
          print(f"已用有效库覆盖原始库: {len(rows)} 行, 列: {','.join(RAW_HEADER)}")
          PY
          echo "清理前 ${before} 行, 清理后 ${after} 行"

      - name: 提交清理结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vpngate.csv
          if git diff --cached --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "chore: 每周清理原始库 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin main
          fi
